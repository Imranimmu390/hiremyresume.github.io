<!DOCTYPE html>
<html>
<head>
    <title>HireMyResume</title>
    <style>
        body {
            background-image: url("/static/background.jpg");
            background-size: cover;
            color: white;
            text-align: center;
            padding-top: 100px;
            font-family: Arial;
        }
        .login-box {
            background-color: rgba(0,0,0,0.6);
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
        }
        input[type="email"], input[type="password"] {
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            width: 200px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
        }
        h1 {
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Hire My Resume</h1>
    <p>AutoApply platform that applies jobs automatically.</p>

    <div class="login-box">
        <h2>Login</h2>
        <form method="POST" action="/login">
            <label>Email:</label><br>
            <input type="email" name="email" required><br><br>
            <label>Password:</label><br>
            <input type="password" name="password" required><br><br>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
